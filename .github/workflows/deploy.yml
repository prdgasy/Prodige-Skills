
name: Deploy Minecraft Datapack

on:
  push:
    branches:
      - main
    paths:
      - 'code/.sandstone/output/datapack/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout datapack
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            code/.sandstone/output/datapack
          sparse-checkout-cone-mode: true

      
      
     
      - name: Copy datapack
        id: copy
        shell: powershell
        run: |
          $source = "$env:GITHUB_WORKSPACE\code\.sandstone\output\datapack"
          $destination = "C:\Users\TOSHIBA\AppData\Roaming\ModrinthApp\profiles\Data_Resource Pack Modpack\saves\FRIANDISE\datapacks\prodige_skills"

          if (!(Test-Path $source)) {
            throw "Datapack output not found: $source"
          }

          $scriptPath = Join-Path $env:RUNNER_TEMP "datapack-progress.ps1"

          $progressScript = @'
          param(
            [string]$Source,
            [string]$Destination
          )

          $ErrorActionPreference = "Stop"

          function Format-Size([double]$Bytes) {
            if ($Bytes -ge 1MB) { return "{0:N2} MB" -f ($Bytes / 1MB) }
            if ($Bytes -ge 1KB) { return "{0:N2} KB" -f ($Bytes / 1KB) }
            return "{0:N0} B" -f $Bytes
          }

          Clear-Host
          $Host.UI.RawUI.WindowTitle = "Minecraft | Datapack Deployment"

          Write-Host ""
          Write-Host "  MINECRAFT DATAPACK DEPLOYMENT" -ForegroundColor Cyan
          Write-Host "  ----------------------------------------" -ForegroundColor DarkGray
          Write-Host ""
          Write-Host "  Source      : Compiled datapack" -ForegroundColor Gray
          Write-Host "  Destination : Minecraft - FRIANDISE" -ForegroundColor Gray
          Write-Host ""

          New-Item -ItemType Directory -Force -Path $Destination | Out-Null

          $files = @(Get-ChildItem -LiteralPath $Source -File -Recurse)

          $toCopy = @(
            foreach ($file in $files) {
              $relative = $file.FullName.Substring($Source.TrimEnd('\').Length).TrimStart('\')
              $target = Join-Path $Destination $relative

              $needsCopy = $true

              if (Test-Path -LiteralPath $target) {
                $existing = Get-Item -LiteralPath $target
                $needsCopy = (
                  $existing.Length -ne $file.Length -or
                  $existing.LastWriteTimeUtc -ne $file.LastWriteTimeUtc
                )
              }

              if ($needsCopy) {
                [PSCustomObject]@{
                  Path = $target
                  Size = [double]$file.Length
                }
              }
            }
          )

          $totalBytes = ($toCopy | Measure-Object -Property Size -Sum).Sum
          if (!$totalBytes) { $totalBytes = 0 }

          $totalFiles = $toCopy.Count
          $log = Join-Path $env:TEMP "datapack-robocopy.log"

          Write-Host "  Files to update : $totalFiles" -ForegroundColor White
          Write-Host "  Transfer size   : $(Format-Size $totalBytes)" -ForegroundColor White
          Write-Host ""
          Write-Host "  Synchronizing..." -ForegroundColor Yellow

          $arguments = "`"$Source`" `"$Destination`" /MIR /MT:8 /R:2 /W:1 /NFL /NDL /NJH /NJS /NP /LOG:`"$log`""

          $process = Start-Process -FilePath "robocopy.exe" `
            -ArgumentList $arguments -PassThru -WindowStyle Hidden

          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          $previousBytes = 0
          $previousTime = 0

          while (!$process.HasExited) {
            $copiedBytes = 0
            $completedFiles = 0

            foreach ($item in $toCopy) {
              if (Test-Path -LiteralPath $item.Path) {
                $length = (Get-Item -LiteralPath $item.Path).Length
                $copiedBytes += [Math]::Min($length, $item.Size)

                if ($length -ge $item.Size) {
                  $completedFiles++
                }
              }
            }

            $percent = if ($totalBytes -gt 0) {
              [Math]::Min(99, [int](100 * $copiedBytes / $totalBytes))
            } else {
              99
            }

            $elapsed = $watch.Elapsed.TotalSeconds
            $speed = if ($elapsed -gt $previousTime) {
              ($copiedBytes - $previousBytes) / ($elapsed - $previousTime)
            } else { 0 }

            $status = "{0}% | {1}/{2} files | {3}/{4}" -f `
              $percent, $completedFiles, $totalFiles, `
              (Format-Size $copiedBytes), (Format-Size $totalBytes)

            $operation = "Speed: $(Format-Size $speed)/s"

            Write-Progress `
              -Activity "Minecraft Datapack Deployment" `
              -Status $status `
              -CurrentOperation $operation `
              -PercentComplete $percent

            $previousBytes = $copiedBytes
            $previousTime = $elapsed

            Start-Sleep -Milliseconds 400
            $process.Refresh()
          }

          $process.WaitForExit()
          $code = $process.ExitCode
          $watch.Stop()

          Write-Progress -Activity "Minecraft Datapack Deployment" -Completed

          Write-Host ""

          if ($code -ge 8) {
            Write-Host "  DEPLOYMENT FAILED" -ForegroundColor Red
            Write-Host "  Robocopy exit code: $code" -ForegroundColor Red
            Start-Sleep -Seconds 5
            exit 1
          }

          Write-Host "  DEPLOYMENT SUCCESSFUL!" -ForegroundColor Green
          Write-Host "  Files synchronized: $totalFiles" -ForegroundColor White
          Write-Host "  Duration: $($watch.Elapsed.ToString('mm\:ss'))" -ForegroundColor Gray
          Write-Host ""
          Start-Sleep -Seconds 4
          exit 0
          '@

          Set-Content -Path $scriptPath -Value $progressScript -Encoding UTF8

          $arguments = "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`" -Source `"$source`" -Destination `"$destination`""

          $window = Start-Process -FilePath "powershell.exe" `
            -ArgumentList $arguments -PassThru -Wait

          if ($window.ExitCode -ne 0) {
            throw "Datapack deployment failed."
          }

