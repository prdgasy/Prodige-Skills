
name: Deploy Minecraft Datapack

on:
  push:
    branches:
      - main
    paths:
      - 'code/.sandstone/output/datapack/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout datapack
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            code/.sandstone/output/datapack
          sparse-checkout-cone-mode: true

      
      
      - name: Copy datapack
        id: copy
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $source = "$env:GITHUB_WORKSPACE\code\.sandstone\output\datapack"
          $destination = "C:\Users\TOSHIBA\AppData\Roaming\ModrinthApp\profiles\Data_Resource Pack Modpack\saves\FRIANDISE\datapacks\prodige_skills"

          if (!(Test-Path $source)) {
            throw "Datapack output not found: $source"
          }

          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          $form = New-Object System.Windows.Forms.Form
          $form.Text = "Minecraft - Déploiement"
          $form.Size = New-Object System.Drawing.Size(380, 155)
          $form.StartPosition = "CenterScreen"
          $form.FormBorderStyle = "FixedDialog"
          $form.MaximizeBox = $false
          $form.MinimizeBox = $false
          $form.TopMost = $true

          $label = New-Object System.Windows.Forms.Label
          $label.Text = "Déploiement du datapack en cours..."
          $label.Location = New-Object System.Drawing.Point(18, 18)
          $label.Size = New-Object System.Drawing.Size(330, 25)
          $label.Font = New-Object System.Drawing.Font("Segoe UI", 10)
          $form.Controls.Add($label)

          $progress = New-Object System.Windows.Forms.ProgressBar
          $progress.Location = New-Object System.Drawing.Point(18, 55)
          $progress.Size = New-Object System.Drawing.Size(330, 22)
          $progress.Style = "Marquee"
          $progress.MarqueeAnimationSpeed = 25
          $form.Controls.Add($progress)

          $status = New-Object System.Windows.Forms.Label
          $status.Text = "Synchronisation des fichiers..."
          $status.Location = New-Object System.Drawing.Point(18, 88)
          $status.Size = New-Object System.Drawing.Size(330, 22)
          $form.Controls.Add($status)

          $arguments = "`"$source`" `"$destination`" /MIR /NFL /NDL /NJH /NJS /NP"

          $process = Start-Process -FilePath "robocopy.exe" `
            -ArgumentList $arguments -PassThru -WindowStyle Hidden

          $timer = New-Object System.Windows.Forms.Timer
          $timer.Interval = 300
          $script:finished = $false
          $script:copyCode = -1
          $script:closeAt = [DateTime]::MaxValue

          $timer.Add_Tick({
            if (!$script:finished -and $process.HasExited) {
              $script:copyCode = $process.ExitCode
              $script:finished = $true
              $progress.Style = "Continuous"
              $progress.MarqueeAnimationSpeed = 0

              if ($script:copyCode -lt 8) {
                $progress.Value = 100
                $label.Text = "Déploiement terminé !"
                $status.Text = "Datapack copié avec succès."
              } else {
                $label.Text = "Échec du déploiement !"
                $status.Text = "Code erreur Robocopy : $script:copyCode"
                $progress.Value = 0
              }

              $script:closeAt = [DateTime]::Now.AddSeconds(5)
            }

            if ($script:finished -and [DateTime]::Now -ge $script:closeAt) {
              $timer.Stop()
              $form.Close()
            }
          })

          $timer.Start()
          [System.Windows.Forms.Application]::Run($form)
          $timer.Dispose()
          $form.Dispose()

          if ($script:copyCode -ge 8) {
            throw "Robocopy failed with exit code $script:copyCode"
          }

          Write-Host "Datapack deployed successfully!"

