
name: Deploy Minecraft Datapack

on:
  push:
    branches:
      - main
    paths:
      - 'code/.sandstone/output/datapack/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout datapack
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            code/.sandstone/output/datapack
          sparse-checkout-cone-mode: true

      - name: Copy datapack
        id: copy
        shell: powershell
        run: |
          $source = "$env:GITHUB_WORKSPACE\code\.sandstone\output\datapack"
          $destination = "C:\Users\TOSHIBA\AppData\Roaming\ModrinthApp\profiles\Data_Resource Pack Modpack\saves\FRIANDISE\datapacks\prodige_skills"

          if (!(Test-Path $source)) {
            throw "Datapack output not found: $source"
          }

          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          robocopy $source $destination /MIR /NFL /NDL /NJH /NJS /NP

          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed with exit code $LASTEXITCODE"
          }


      - name: Windows notification
        if: always()
        shell: powershell
        env:
          COPY_OUTCOME: ${{ steps.copy.outcome }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $notify = New-Object System.Windows.Forms.NotifyIcon
          $notify.Icon = [System.Drawing.SystemIcons]::Information
          $notify.Visible = $true

          if ($env:COPY_OUTCOME -eq "success") {
            $notify.BalloonTipTitle = "Minecraft"
            $notify.BalloonTipText = "Datapack déployé avec succès !"
            $notify.BalloonTipIcon = [System.Windows.Forms.ToolTipIcon]::Info
          } else {
            $notify.BalloonTipTitle = "Minecraft - Erreur"
            $notify.BalloonTipText = "Le déploiement du datapack a échoué."
            $notify.BalloonTipIcon = [System.Windows.Forms.ToolTipIcon]::Error
          }

          $notify.ShowBalloonTip(10000)
          Start-Sleep -Seconds 10
          $notify.Dispose()

